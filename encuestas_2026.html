<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encuestas en Hogares 2026 - Oficina Auxiliar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#12161c; --panel:#171c24; --line:#2a313c; --text:#e6e9ee; --muted:#8c96a5; --accent:#4cc9f0;
    --panel-w:350px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
  #map{position:absolute;inset:0;background:#0d1015}

  /* ---------- Panel ---------- */
  #panel{
    position:absolute;top:0;left:0;bottom:0;width:var(--panel-w);max-width:92vw;z-index:1000;
    background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    transition:transform .28s ease;box-shadow:4px 0 18px rgba(0,0,0,.35);
  }
  #panel.hidden{transform:translateX(-100%)}
  #toggle{
    position:absolute;top:14px;left:100%;width:34px;height:42px;
    background:var(--panel);color:var(--text);border:1px solid var(--line);border-left:none;
    border-radius:0 8px 8px 0;cursor:pointer;font-size:18px;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  #toggle:hover{color:var(--accent)}
  .head{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
  .head h1{margin:0;font-size:15px;line-height:1.3;letter-spacing:.04em;font-weight:700}
  .counter{margin-top:14px;display:flex;align-items:baseline;gap:10px}
  .counter .label{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
  .counter .num{font-size:34px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
  .counter .of{font-size:12px;color:var(--muted)}

  .body{flex:1;overflow-y:auto;padding:6px 18px 18px}
  .body::-webkit-scrollbar{width:8px}
  .body::-webkit-scrollbar-thumb{background:#2f3743;border-radius:4px}
  .group{padding:14px 0;border-bottom:1px solid var(--line)}
  .group:last-of-type{border-bottom:none}
  .group-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .group-h h2{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .mini{display:flex;gap:6px}
  .mini button{background:none;border:1px solid var(--line);color:var(--muted);font-size:11px;padding:2px 8px;border-radius:10px;cursor:pointer}
  .mini button:hover{color:var(--text);border-color:var(--muted)}

  label.opt{display:flex;align-items:center;gap:9px;padding:5px 4px;border-radius:6px;cursor:pointer;font-size:14px;user-select:none}
  label.opt:hover{background:#1e2530}
  label.opt input{accent-color:var(--accent);margin:0;width:15px;height:15px}
  .sw{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.08)}
  .opt .n{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .opt .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  #munSearch{width:100%;margin-bottom:6px;padding:7px 10px;background:#0f1319;border:1px solid var(--line);border-radius:7px;color:var(--text);font-size:13px;outline:none}
  #munSearch:focus{border-color:var(--accent)}
  #munList{max-height:240px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:4px;background:#0f1319}
  #munList::-webkit-scrollbar{width:8px}
  #munList::-webkit-scrollbar-thumb{background:#2f3743;border-radius:4px}

  .foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .foot .row{display:flex;gap:8px}
  .btn{flex:1;background:#1e2530;color:var(--text);border:1px solid var(--line);padding:8px 10px;border-radius:8px;font-size:13px;cursor:pointer}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .foot label{font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:center;cursor:pointer}
  .foot input{accent-color:var(--accent)}

  /* ---------- Popup (dark) ---------- */
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--text);border:1px solid var(--line)}
  .leaflet-popup-content{margin:12px 14px;font-size:13px}
  .pp-title{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:6px}
  .pp table{border-collapse:collapse}
  .pp td{padding:2px 10px 2px 0}
  .pp td:first-child{color:var(--muted)}
  .leaflet-control-layers,.leaflet-bar a{background:var(--panel)!important;color:var(--text)!important;border-color:var(--line)!important}
  .leaflet-control-attribution{background:rgba(18,22,28,.8)!important;color:var(--muted)!important}
  .leaflet-control-attribution a{color:#9db4cc!important}
  .leaflet-control-zoom{transition:margin-left .28s ease}
  @media(max-width:600px){ :root{--panel-w:320px} }
</style>
</head>

<div id="map"></div>

<aside id="panel">

  <div class="body">
    <div class="group">
      <div class="group-h"><h2>Proyecto</h2>
        <div class="mini"><button data-all="proy">Todos</button><button data-none="proy">Ninguno</button></div></div>
      <div id="proyList"></div>
    </div>

    <div class="group">
      <div class="group-h"><h2>Oficina</h2>
        <div class="mini"><button data-all="ofi">Todos</button><button data-none="ofi">Ninguno</button></div></div>
      <div id="ofiList"></div>
    </div>

    <div class="group">
      <div class="group-h"><h2>Municipio (MUN)</h2>
        <div class="mini"><button data-all="mun">Todos</button><button data-none="mun">Ninguno</button></div></div>
      <input id="munSearch" type="search" placeholder="Buscar municipio o clave…">
      <div id="munList"></div>
    </div>
  </div>

  <div class="foot">
    <div class="row">
      <button class="btn" id="fit">Ajustar zoom</button>
      <button class="btn" id="reset">Restablecer</button>
    </div>
    <label><input type="checkbox" id="autofit" checked> Ajustar zoom al filtrar</label>
  </div>
</aside>

/* Catálogo de municipios de Chihuahua (clave INEGI → nombre). Edita si necesitas otros nombres. */
const MUN_NAMES = {
"001":"Ahumada","002":"Aldama","003":"Allende","004":"Aquiles Serdán","005":"Ascensión","006":"Bachíniva","007":"Balleza","008":"Batopilas","009":"Bocoyna","010":"Buenaventura","011":"Camargo","012":"Carichí","013":"Casas Grandes","014":"Coronado","015":"Coyame del Sotol","016":"La Cruz","017":"Cuauhtémoc","018":"Cusihuiriachi","019":"Chihuahua","020":"Chínipas","021":"Delicias","022":"Dr. Belisario Domínguez","023":"Galeana","024":"Santa Isabel","025":"Gómez Farías","026":"Gran Morelos","027":"Guachochi","028":"Guadalupe","029":"Guadalupe y Calvo","030":"Guazapares","031":"Guerrero","032":"Hidalgo del Parral","033":"Huejotitán","034":"Ignacio Zaragoza","035":"Janos","036":"Jiménez","037":"Juárez","038":"Julimes","039":"López","040":"Madera","041":"Maguarichi","042":"Manuel Benavides","043":"Matachí","044":"Matamoros","045":"Meoqui","046":"Morelos","047":"Moris","048":"Namiquipa","049":"Nonoava","050":"Nuevo Casas Grandes","051":"Ojinaga","052":"Praxedis G. Guerrero","053":"Riva Palacio","054":"Rosales","055":"Rosario","056":"San Francisco de Borja","057":"San Francisco de Conchos","058":"San Francisco del Oro","059":"Santa Bárbara","060":"Satevó","061":"Saucillo","062":"Temósachic","063":"El Tule","064":"Urique","065":"Uruachi","066":"Valle de Zaragoza"
};

/* Colores por PROYECTO */
const PALETTE = ["#4cc9f0","#f72585","#ffd166","#80ed99","#b388ff","#ff9f1c","#2ec4b6","#ff6b6b"];

/* ====================== ESTADO ====================== */
const proyColor = META.proy.map((_, i) => PALETTE[i % PALETTE.length]);
const sel = {
  proy: new Set(META.proy.map((_, i) => i)),
  ofi:  new Set(META.ofi.map((_, i) => i)),
  mun:  new Set(META.mun.map((_, i) => i))
};
const munLabel = i => { const c = META.mun[i]; return MUN_NAMES[c] ? `${c} – ${MUN_NAMES[c]}` : c; };
const fmt = n => n.toLocaleString("es-MX");

/* ====================== MAPA ====================== */
const map = L.map("map", { preferCanvas: true, zoomControl: false, minZoom: 4 });
L.control.zoom({ position: "topright" }).addTo(map);

const dark = L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
  subdomains: "abcd", maxZoom: 19
}).addTo(map);
const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: '&copy; OpenStreetMap', maxZoom: 19
});
const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
  attribution: "Tiles &copy; Esri", maxZoom: 19
});
L.control.layers({ "Oscuro": dark, "Calles (OSM)": osm, "Satélite": sat }, null, { position: "topright" }).addTo(map);

const renderer = L.canvas({ padding: 0.5 });
const group = L.featureGroup().addTo(map);

// Se crea un marcador por registro una sola vez; luego solo se agregan/quitan según filtros
const markers = ROWS.map((r, idx) => {
  const m = L.circleMarker([r[0], r[1]], {
    renderer, radius: 4, weight: 0.8, color: "#0b0e12",
    fillColor: proyColor[r[2]], fillOpacity: 0.9
  });
  m._i = idx;
  return m;
});

function radiusForZoom(z){ return z <= 8 ? 2.5 : z <= 10 ? 3.5 : z <= 13 ? 5 : 7; }
map.on("zoomend", () => {
  const rad = radiusForZoom(map.getZoom());
  group.eachLayer(l => l.setRadius(rad));
});

group.on("click", e => {
  const r = ROWS[e.layer._i];
  const html = `<div class="pp"><div class="pp-title"><span class="sw" style="background:${proyColor[r[2]]}"></span>${META.proy[r[2]]}</div>
    <table>
    <tr><td>Oficina</td><td>${META.ofi[r[3]]}</td></tr>
    <tr><td>Municipio</td><td>${munLabel(r[4])}</td></tr>
    <tr><td>Localidad</td><td>${r[5]}</td></tr>
    <tr><td>AGEB</td><td>${r[6]}</td></tr>
    <tr><td>Manzana</td><td>${r[7]}</td></tr>
    <tr><td>Coordenadas</td><td>${r[0].toFixed(6)}, ${r[1].toFixed(6)}</td></tr>
    </table></div>`;
  L.popup({ closeButton: true }).setLatLng(e.layer.getLatLng()).setContent(html).openOn(map);
});

/* ====================== FILTROS ====================== */
function counts(col){
  const c = new Array(META[col === "proy" ? "proy" : col === "ofi" ? "ofi" : "mun"].length).fill(0);
  const k = col === "proy" ? 2 : col === "ofi" ? 3 : 4;
  ROWS.forEach(r => c[r[k]]++);
  return c;
}
const cnt = { proy: counts("proy"), ofi: counts("ofi"), mun: counts("mun") };

function buildList(host, key, labelFn, withSwatch){
  const el = document.getElementById(host);
  el.innerHTML = "";
  META[key].forEach((_, i) => {
    const lab = document.createElement("label");
    lab.className = "opt";
    lab.dataset.text = labelFn(i).toLowerCase();
    lab.innerHTML = `<input type="checkbox" checked data-key="${key}" data-i="${i}">
      ${withSwatch ? `<span class="sw" style="background:${proyColor[i]}"></span>` : ""}
      <span class="nm">${labelFn(i)}</span><span class="n">${fmt(cnt[key][i])}</span>`;
    el.appendChild(lab);
  });
}
buildList("proyList", "proy", i => META.proy[i], true);
buildList("ofiList",  "ofi",  i => META.ofi[i],  false);
buildList("munList",  "mun",  i => munLabel(i),  false);

document.querySelector(".body").addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.key === undefined) return;
  const s = sel[t.dataset.key], i = +t.dataset.i;
  t.checked ? s.add(i) : s.delete(i);
  apply();
});

function setAll(key, on){
  sel[key] = on ? new Set(META[key].map((_, i) => i)) : new Set();
  // Respeta el buscador de municipios: "Todos/Ninguno" actúa solo sobre lo visible
  document.querySelectorAll(`input[data-key="${key}"]`).forEach(c => c.checked = on);
}
document.querySelectorAll("[data-all]").forEach(b => b.onclick = () => { setAll(b.dataset.all, true);  apply(); });
document.querySelectorAll("[data-none]").forEach(b => b.onclick = () => { setAll(b.dataset.none, false); apply(); });

document.getElementById("munSearch").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll("#munList label").forEach(l => l.style.display = l.dataset.text.includes(q) ? "" : "none");
});

function apply(fit){
  group.clearLayers();
  const rad = radiusForZoom(map.getZoom());
  let n = 0;
  const pts = [];
  for (let i = 0; i < ROWS.length; i++){
    const r = ROWS[i];
    if (sel.proy.has(r[2]) && sel.ofi.has(r[3]) && sel.mun.has(r[4])){
      const m = markers[i]; m.setRadius(rad); group.addLayer(m); n++; pts.push([r[0], r[1]]);
    }
  }
  document.getElementById("count").textContent = fmt(n);
  if ((fit || document.getElementById("autofit").checked) && pts.length){
    map.fitBounds(L.latLngBounds(pts), { padding: [40, 40], maxZoom: 15 });
  }
}

document.getElementById("fit").onclick = () => {
  const b = group.getBounds();
  if (b.isValid()) map.fitBounds(b, { padding: [40, 40], maxZoom: 15 });
};
document.getElementById("reset").onclick = () => {
  ["proy","ofi","mun"].forEach(k => setAll(k, true));
  document.getElementById("munSearch").value = "";
  document.querySelectorAll("#munList label").forEach(l => l.style.display = "");
  apply(true);
};

/* ====================== PANEL DESPLEGABLE ====================== */
const panel = document.getElementById("panel"), toggle = document.getElementById("toggle");
toggle.onclick = () => {
  const hide = panel.classList.toggle("hidden");
  toggle.innerHTML = hide ? "&#10095;" : "&#10094;";
  setTimeout(() => map.invalidateSize(), 300);
};

/* ====================== INICIO ====================== */
document.getElementById("total").textContent = fmt(ROWS.length);
map.fitBounds(L.latLngBounds(ROWS.map(r => [r[0], r[1]])), { padding: [40, 40] });
apply(false);
</script>
</body>
</html>
